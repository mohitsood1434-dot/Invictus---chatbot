const GREET_WORDS = ["hi","hello","hey","namaste","sat sri akal","ssa","good morning","good evening","hii","helo","ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ","नमस्ते"];
const THANKS_WORDS = ["thanks","thank you","thankyou","thx","dhanyavaad","dhanyawad","shukriya","धन्यवाद","शुक्रिया","ਧੰਨਵਾਦ","ਸ਼ੁਕਰੀਆ"];
const BYE_WORDS = ["bye","goodbye","tata","alvida","phir milenge","ok bye","okay bye","ਅਲਵਿਦਾ","अलविदा"];

const LANG_NAME = { en:"English", hi:"Hindi", pa:"Punjabi" };

/* ================= CHAT ENGINE ================= */
const chatInner = document.getElementById("chatInner");
const chatBox = document.getElementById("chat");
const input = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const history = [];

function addBubble(role, html) {
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "bot");
  row.innerHTML = (role === "bot" ? '<div class="avatar"><span class="i">i</span>C</div>' : "") +
    '<div class="bubble">' + html + "</div>";
  chatInner.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
  return row;
}

function showTyping() {
  return addBubble("bot", '<span class="dots"><span></span><span></span><span></span></span>');
}

function matchList(t, list) {
  return list.some(w => t === w || t.startsWith(w + " ") || t.startsWith(w + "!") ||
    t.endsWith(" " + w) || t.includes(" " + w + " "));
}

function faqMatch(t) {
  let best = null, bestScore = 0;
  for (const f of FAQS) {
    const score = f.k.filter(w =>
      new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^a-z0-9]|$)").test(t)
    ).length;
    if (score > bestScore) { bestScore = score; best = f; }
  }
  return bestScore > 0 ? best.a : null;
}

function ruleAnswer(q) {
  const t = q.toLowerCase().trim();
  if (matchList(t, GREET_WORDS)) return KB[LANG].greet;
  if (matchList(t, THANKS_WORDS)) return KB[LANG].thanks;
  if (matchList(t, BYE_WORDS)) return KB[LANG].bye;

  // English: use the full 101-FAQ knowledge base for instant answers.
  if (LANG === "en") return faqMatch(t);

  // Hindi / Punjabi: use core trilingual answers; rest goes to AI in that language.
  let best = null, bestScore = 0;
  for (const r of RULES) {
    const score = r.words.filter(w => new RegExp("(^|[^a-z])" + w + "([^a-z]|$)").test(t)).length;
    if (score > bestScore) { bestScore = score; best = r.key; }
  }
  return bestScore > 0 ? KB[LANG][best] : null;
}

async function aiAnswer(q) {
  if (!AI_ENDPOINT) return null;
  try {
    const res = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: q + "\n\n(Important: reply in " + LANG_NAME[LANG] + " language.)",
        history: history.slice(-8),
      }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.answer || null;
  } catch (e) { return null; }
}

async function send(textOverride) {
  const q = (textOverride ?? input.value).trim();
  if (!q) return;
  input.value = "";
  sendBtn.disabled = true;
  addBubble("user", q.replace(/</g, "&lt;"));
  history.push({ role: "user", content: q });

  const typing = showTyping();
  await new Promise(r => setTimeout(r, 500));

  let ans = ruleAnswer(q);
  if (!ans) ans = await aiAnswer(q);
  if (!ans) ans = KB[LANG].fallback;

  typing.remove();
  addBubble("bot", ans);
  history.push({ role: "assistant", content: ans.replace(/<[^>]+>/g, "") });
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener("click", () => send());
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

/* Language switcher */
document.querySelectorAll(".langbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.lang === LANG) return;
    LANG = btn.dataset.lang;
    document.querySelectorAll(".langbtn").forEach(b => b.classList.toggle("active", b === btn));
    addBubble("bot", KB[LANG].switched);
  });
});

/* Quick chips (English only) */
const CHIPS = ["Fee structure?", "Admission process?", "School timings?", "Bus charges?", "Clubs & houses?", "Career counselling?", "Contact number?"];
const chipsBox = document.getElementById("chips");
CHIPS.forEach(c => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = c;
  b.onclick = () => send(c);
  chipsBox.appendChild(b);
});

/* Keep Supabase project awake (silent ping, no Gemini cost) */
if (AI_ENDPOINT) {
  fetch(AI_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ping: true }),
  }).catch(() => {});
}

/* Welcome */
addBubble("bot", KB.en.welcome);
</script>
