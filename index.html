<style>

  .right-top { display:flex; align-items:center; gap:8px; }
  .status { font-size:11px; color:#D9DEE9; background:rgba(255,255,255,.12); padding:4px 10px; border-radius:999px; }

  .langbar { display:flex; gap:6px; margin-top:10px; }

  .redline { height:3px; background:var(--red); }

  .chat { flex:1; overflow-y:auto; padding:16px; }
  .chat-inner { max-width:680px; margin:0 auto; }
  .row { display:flex; margin-bottom:12px; }
  .row.user { justify-content:flex-end; }

  .bubble { max-width:80%; padding:11px 15px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
  .bot .bubble { background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:18px 18px 18px 4px; box-shadow:0 1px 2px rgba(20,38,78,.06); }
  .user .bubble { background:var(--navy); color:#fff; border-radius:18px 18px 4px 18px; }
  .bubble b { color:var(--navy); }
  .user .bubble b { color:#fff; }

  .dots span { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--red); margin-right:4px; animation:bounce 1s infinite; }
  .dots span:nth-child(2){ animation-delay:.15s } .dots span:nth-child(3){ animation-delay:.3s }
  @keyframes bounce { 0%,60%,100%{ transform:translateY(0) } 30%{ transform:translateY(-6px) } }

  .chips { padding:0 16px 8px; }
  .chips-inner { max-width:680px; margin:0 auto; display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip { flex-shrink:0; background:#fff; color:var(--navy); border:1px solid rgba(20,38,78,.18); border-radius:999px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer; }
  .chip:active { background:var(--navy); color:#fff; }

  .inputbar { padding:6px 16px 14px; }
  .inputbar-inner { max-width:680px; margin:0 auto; }
  .inputbox { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid #E0E4EC; border-radius:999px; padding:8px 8px 8px 18px; box-shadow:0 2px 8px rgba(20,38,78,.08); }
  .inputbox input { flex:1; border:none; outline:none; font-size:14px; color:var(--navy); background:transparent; }
  .send { width:38px; height:38px; border:none; border-radius:50%; background:var(--red); color:#fff; font-size:16px; cursor:pointer; flex-shrink:0; }
  .send:disabled { opacity:.4; }
  .footnote { text-align:center; font-size:10px; color:#8B93A5; margin-top:8px; }
  .footnote a { color:var(--navy); }
  .credit { text-align:center; font-size:10px; color:#A8AFBE; margin-top:3px; letter-spacing:.03em; }
  .credit b { color:#6B7488; font-weight:600; }

const RULES = [
  { key:"fees", words:["fee","fees","फीस","ਫੀਸ","paisa","paise","kitni","charge","monthly","quarterly","cost","kharcha","price","installment","discount","sibling"] },
  { key:"admission", words:["admission","dakhila","दाखिला","ਦਖਲਾ","admit","entry","test","process","register","registration","apply","form","interview","interaction"] },
  { key:"documents", words:["document","documents","kagaz","कागज","दस्तावेज़","ਦਸਤਾਵੇਜ਼","certificate","birth","aadhar","aadhaar","photo","papers","proof","tc","leaving"] },
  { key:"transport", words:["bus","transport","van","gaadi","गाड़","बस","ਬੱਸ","pick","drop","route","conveyance","km","distance"] },
  { key:"contact", words:["contact","phone","number","call","email","address","location","kahan","कहाँ","संपर्क","ਸੰਪਰਕ","map","visit","whatsapp","baat"] },
  { key:"about", words:["about","school","invictus","board","cbse","cambridge","curriculum","principal","kaisa","facilities","ac","smartboard","ਸਕੂਲ","स्कूल"] },
];

const GREET_WORDS = ["hi","hello","hey","namaste","sat sri akal","ssa","good morning","good evening","hii","helo","ਸਤਿ ਸ੍ਰੀ ਅਕਾਲ","नमस्ते"];

const LANG_NAME = { en:"English", hi:"Hindi", pa:"Punjabi" };

/* ================= CHAT ENGINE ================= */
const chatInner = document.getElementById("chatInner");
const chatBox = document.getElementById("chat");
const input = document.getElementById("msgInput");
const sendBtn = document.getElementById("sendBtn");
const history = [];

function addBubble(role, html) {
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "bot");
  row.innerHTML = (role === "bot" ? '<div class="avatar"><span class="i">i</span>C</div>' : "") +
    '<div class="bubble">' + html + "</div>";
  chatInner.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
  return row;
}

function showTyping() {
  return addBubble("bot", '<span class="dots"><span></span><span></span><span></span></span>');
}

function ruleAnswer(q) {
  const t = q.toLowerCase();
  if (GREET_WORDS.some(w => t === w || t.startsWith(w + " ") || t.startsWith(w + "!"))) {
    return KB[LANG].greet;
  }
  let best = null, bestScore = 0;
  for (const r of RULES) {
    const score = r.words.filter(w => new RegExp("(^|[^a-z])" + w + "([^a-z]|$)").test(t)).length;
    if (score > bestScore) { bestScore = score; best = r.key; }
  }
  return bestScore > 0 ? KB[LANG][best] : null;
}

async function aiAnswer(q) {
  if (!AI_ENDPOINT) return null;
  try {
    const res = await fetch(AI_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: q + "\n\n(Important: reply in " + LANG_NAME[LANG] + " language.)",
        history: history.slice(-8),
      }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.answer || null;
  } catch (e) { return null; }
}

async function send(textOverride) {
  const q = (textOverride ?? input.value).trim();
  if (!q) return;
  input.value = "";
  sendBtn.disabled = true;
  addBubble("user", q.replace(/</g, "&lt;"));
  history.push({ role: "user", content: q });

  const typing = showTyping();
  await new Promise(r => setTimeout(r, 500));

  let ans = ruleAnswer(q);
  if (!ans) ans = await aiAnswer(q);
  if (!ans) ans = KB[LANG].fallback;

  typing.remove();
  addBubble("bot", ans);
  history.push({ role: "assistant", content: ans.replace(/<[^>]+>/g, "") });
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener("click", () => send());
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

/* Language switcher */
document.querySelectorAll(".langbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.lang === LANG) return;
    LANG = btn.dataset.lang;
    document.querySelectorAll(".langbtn").forEach(b => b.classList.toggle("active", b === btn));
    addBubble("bot", KB[LANG].switched);
  });
});

/* Quick chips (English only) */
const CHIPS = ["Fee structure?", "Admission process?", "Clubs & Activities?", "Career Counselling?", "Bus charges?", "Contact number?"];
const chipsBox = document.getElementById("chips");
CHIPS.forEach(c => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = c;
  b.onclick = () => send(c);
  chipsBox.appendChild(b);
});

/* Welcome */
addBubble("bot", KB.en.welcome);
</script>
